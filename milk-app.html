function modFat30(){ return `<div class="card"><h3>📊 ${t('fat30')}</h3><div id="fatBox"></div></div>`; }
function renderFat30(){
  const box=$('fatBox'); if(!box) return;
  const days=[]; const now=new Date();
  for(let i=29;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i); days.push(ymd(d)); }
  const ag=days.map(function(dt){ const es=state.entries.filter(e=>e.date===dt&&e.kind==='sale'&&e.fat>0);
    const q=es.reduce((s,e)=>s+e.qty,0), w=es.reduce((s,e)=>s+e.qty*e.fat,0); return {dt:dt,f:q?w/q:0}; });
  const vals=ag.filter(x=>x.f>0).map(x=>x.f);
  if(!vals.length){ box.innerHTML='<div class="empty">'+t('no_fat')+'</div>'; return; }
  const max=Math.max.apply(null,vals), min=Math.min.apply(null,vals);
  const avg=vals.reduce((s,v)=>s+v,0)/vals.length;
  box.innerHTML='<div class="fatstrip">'+ag.map(x=>`<i style="height:${Math.round(x.f/max*100)}%" title="${x.dt} · ${x.f?x.f.toFixed(1):'-'}"></i>`).join('')+'</div>'
    +`<div class="bill-line" style="margin-top:10px"><span class="k">${t('q_avg')}</span><span class="v">${num(Math.round(avg*100)/100)}</span></div>`
    +`<div class="bill-line"><span class="k">सबसे कम / ज़्यादा</span><span class="v">${num(Math.round(min*100)/100)} / ${num(Math.round(max*100)/100)}</span></div>`;
}
function modWastPie(){ return `<div class="card"><h3>📉 ${t('wastpie')}</h3><div id="wpBox"></div></div>`; }
function renderWastPie(){
  const box=$('wpBox'); if(!box) return;
  const m=monthStr(); const list=state.wastage.filter(x=>x.date.startsWith(m));
  if(!list.length){ box.innerHTML='<div class="empty">'+t('no_data')+'</div>'; return; }
  const by={}; list.forEach(x=>{ const r=((x.reason||'').trim()||'अन्य'); by[r]=(by[r]||0)+(x.value||0); });
  const keys=Object.keys(by), tot=keys.reduce((s,k)=>s+by[k],0)||1;
  const cols=['#0f7b53','#b7791f','#c0392b','#1d6fb8','#7b3fb0','#0c7b7b'];
  let acc=0;
  const stops=keys.map(function(k,i){ const a=acc/tot*360; acc+=by[k]; const b=acc/tot*360; return cols[i%cols.length]+' '+a+'deg '+b+'deg'; }).join(',');
  box.innerHTML='<div style="display:flex;gap:14px;align-items:center"><div class="pie" style="background:conic-gradient('+stops+')"></div><div style="flex:1">'
    +keys.map((k,i)=>`<div class="bill-line" style="padding:3px 0"><span class="k"><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${cols[i%cols.length]};margin-right:6px"></i>${esc(k)}</span><span class="v">${money(by[k])} (${Math.round(by[k]/tot*100)}%)</span></div>`).join('')
    +'</div></div>';
}
/* ---- repeat last + reminders + sync ---- */
function repeatLast(){
  const es=state.entries.filter(e=>e.kind==='sale').slice().sort((a,b)=>(String(b.date)+String(b.id)).localeCompare(String(a.date)+String(a.id)));
  const last=es[0];

let alarmTimer=null;
function alarmBeep(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const ctx=new AC(); const o=ctx.createOscillator(), g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination); o.type='sine'; o.frequency.value=880;
    g.gain.setValueAtTime(0.0001,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25,ctx.currentTime+0.05);
    g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.9);
    o.start(); o.stop(ctx.currentTime+0.95);
    setTimeout(function(){ try{ ctx.close(); }catch(e){} },1400);
  }catch(e){}
}
function shiftRemindCheck(force){
  if(state.settings.shiftRemind===false) return;
  const now=new Date(), h=now.getHours();
  const isAlarm=(h===6||h===17);
  if(!isAlarm && force!==true) return;
  const key=todayStr()+(h<12?'M':'E');
  if(force!==true && state.settings.lastRemind===key) return;
  state.settings.lastRemind=key; save();
  const msg=(h<12?'सुबह':'शाम')+' '+t('alarm_body');
  try{ if(window.Notification && Notification.permission==='granted') new Notification('दूध हिसाब',{body:msg, tag:'milk-shift'}); }catch(e){}
  try{ alarmBeep(); }catch(e){}
  toast('⏰ '+msg);
}
function nextAlarmTime(){ const now=new Date(); const c=[];
  [6,17].forEach(function(h){ const d=new Date(); d.setHours(h,0,0,0); if(d<=now) d.setDate(d.getDate()+1); c.push(d); });
  c.sort(function(a,b){ return a-b; }); return c[0]; }
function scheduleShiftAlarm(){
  if(state.settings.shiftRemind===false) return;
  try{ if(alarmTimer) clearTimeout(alarmTimer); }catch(e){}
  const ms=Math.max(2000, nextAlarmTime().getTime()-Date.now()+1500);
  alarmTimer=setTimeout(function(){ try{ shiftRemindCheck(true); }catch(e){} try{ scheduleShiftAlarm(); }catch(e){} }, ms);
}
function testAlarm(){ try{ alarmBeep(); }catch(e){} shiftRemindCheck(true); }
/* swipe on the entries (register) screen */
function initSwipe(){
  const el=document.getElementById('view-entries'); if(!el||el._swipe) return; el._swipe=true;
  let x0=0,y0=0,t0=0;
  el.addEventListener('touchstart',function(e){ const t=e.touches[0]; x0=t.clientX; y0=t.clientY; t0=Date.now(); },{passive:true});
  el.addEventListener('touchend',function(e){
    const t=e.changedTouches[0]; if(!t) return;
    const dx=t.clientX-x0, dy=t.clientY-y0, dt=Date.now()-t0;
    if(dt>800) return; if(Math.abs(dx)<70) return; if(Math.abs(dy)>Math.abs(dx)) return;
    if(typeof uiTab!=='undefined' && uiTab!=='entries') return;
    try{ if(dx<0) shiftDay(1); else shiftDay(-1); toast(dx<0?'▶ '+fmtDate($('entryDate').value):'◀ '+fmtDate($('entryDate').value)); }catch(err){}
  },{passive:true});
}

function modDataCheck(){ return `<div class="card"><div class="hint" style="margin-bottom:10px">${t('dc_hint')}</div><div id="dcBox"></div></div>`; }
function renderDataCheck(){
  const el=$('dcBox'); if(!el) return;
  const seen={},dups=[]; state.entries.forEach(e=>{ const k=e.partyId+'|'+e.date+'|'+e.shift+'|'+(e.itemId||''); if(seen[k]) dups.push(e); else seen[k]=1; });
  const zero=state.entries.filter(e=>!e.qty||e.qty<=0);
  const nodef=state.parties.filter(p=>p.type==='customer'&&!(p.defaultQty>0));
  const negst=state.items.filter(it=>stockOf(it.id)<0);
  const row=(n,label)=>`<div class="bill-line"><span class="k">${label}</span><span class="v" style="font-weight:700;color:${n?'var(--red)':'var(--green)'}">${n}</span></div>`;
  el.innerHTML=row(dups.length,t('dc_dup'))+row(zero.length,t('dc_zeroqty'))+row(nodef.length,t('dc_nodefault'))+row(negst.length,t('dc_negstock'))
    +((dups.length||zero.length)?`<div class="btn-row" style="margin-top:12px"><button class="btn" onclick="cleanData()">${t('dc_clean')}</button></div>`:'')
    +((!dups.length&&!zero.length&&!nodef.length&&!negst.length)?`<div class="hint" style="margin-top:10px">${t('dc_allok')}</div>`:'');
}
function cleanData(){
  if(!confirm(t('dc_clean')+'?')) return;
  const seen={},keep=[]; let removed=0;
  state.entries.forEach(e=>{ const k=e.partyId+'|'+e.date+'|'+e.shift+'|'+(e.itemId||'');
    if(!e.qty||e.qty<=0){ removed++; return; } if(seen[k]){ removed++; return; } seen[k]=1; keep.push(e); });
  state.entries=keep; save(); renderDataCheck(); renderHome(); renderEntries(); toast(removed+' '+t('dc_cleaned'));
}
