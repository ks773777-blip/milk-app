<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0f7b53" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>दूध हिसाब — Milk Manager</title>
<script>window.onGisLoad=function(){window.__gisReady=true;try{if(window.waitGis)waitGis();}catch(e){}};</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="window.onGisLoad()"></script>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="apple-mobile-web-app-title" content="दूध हिसाब" />
<style>
  :root{
    --green:#0f7b53; --green-d:#0a5c3e; --green-l:#e7f5ee;
    --ink:#16241d; --muted:#6b7c74; --line:#e2e8e4; --bg:#f4f7f5; --card:#ffffff;
    --soft:#eef2f0; --dash:#fafcfb;
    --red:#c0392b; --red-l:#fdecea; --amber:#b7791f; --amber-l:#fdf5e6; --blue:#1d6fb8; --blue-l:#eaf1fb;
    --shadow:0 2px 10px rgba(16,40,30,.06); --radius:16px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  html[data-theme="blue"]{ --green:#1d6fb8; --green-d:#155a94; --green-l:#e8f1fa; }
  html[data-theme="purple"]{ --green:#7b3fb0; --green-d:#5f2e8c; --green-l:#f1e9f8; }
  html[data-theme="teal"]{ --green:#0c7b7b; --green-d:#075c5c; --green-l:#e4f4f4; }
  html[data-dark="1"]{
    --ink:#e8efe9; --muted:#93a39a; --line:#2a352e; --bg:#101613; --card:#19211d;
    --soft:#232e27; --dash:#141c18; --green-l:#153a2a; --red-l:#3a1f1c; --amber-l:#332914; --blue-l:#16283a;
    --shadow:0 2px 10px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans Devanagari',Roboto,Arial,sans-serif;
    background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
    padding-bottom:calc(78px + var(--safe-b));}
  h1,h2,h3,p{margin:0}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
  header.top{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--green),var(--green-d));
    color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 14px;box-shadow:0 2px 12px rgba(10,60,40,.18);}
  .top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand .logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:22px;flex:none}
  .brand h1{font-size:18px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand small{display:block;font-size:11.5px;opacity:.85;font-weight:400;margin-top:1px}
  .top-date{font-size:12.5px;opacity:.9;text-align:right;white-space:nowrap;flex:none}
  .top-right{display:flex;align-items:center;gap:9px;flex:none}
  .acct{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:17px;overflow:hidden;flex:none;border:1.5px solid rgba(255,255,255,.35)}
  .acct img{width:100%;height:100%;object-fit:cover;display:block}
  .g-ava{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none;background:var(--soft)}
  #gSignInBtn{min-height:44px}
  .netbar{position:fixed;left:0;right:0;top:0;z-index:80;background:var(--amber);color:#fff;text-align:center;font-size:13px;font-weight:600;padding:8px 12px;display:none}
  .dr-chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--green-l);color:var(--green-d)}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cal-h{font-size:11px;color:var(--muted);text-align:center;font-weight:700;padding-bottom:4px}
  .cal-c{min-height:52px;border-radius:10px;background:var(--dash);border:1px solid var(--line);padding:5px 3px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;cursor:pointer;overflow:hidden}
  .cal-c.today{border-color:var(--green);box-shadow:0 0 0 2px var(--green-l)}
  .cal-c.empty{background:transparent;border:none;cursor:default}
  .cal-c .d{font-size:12.5px;font-weight:700;line-height:1.1}
  .cal-c .q{font-size:9.5px;color:var(--green-d);font-weight:700}
  .cal-c .a{font-size:9px;color:var(--muted)}
  .calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .calc-k{padding:14px 0;border-radius:12px;background:var(--soft);font-size:18px;font-weight:700}
  .calc-k.op{background:var(--green-l);color:var(--green-d)}
  .calc-k.clr{background:var(--red-l);color:var(--red)}
  .clock{font-size:11.5px;opacity:.92;text-align:right;font-variant-numeric:tabular-nums;letter-spacing:.5px}
  .navrow{display:flex;align-items:center;gap:10px;margin-top:10px}
  .navbtn{width:40px;height:34px;border-radius:10px;background:rgba(255,255,255,.2);color:#fff;font-size:20px;font-weight:800;line-height:1;display:grid;place-items:center;border:1px solid rgba(255,255,255,.3)}
  .navbtn:disabled{opacity:.35}
  .navlbl{flex:1;font-size:12.5px;font-weight:600;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bell{position:relative;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:16px;flex:none;border:1.5px solid rgba(255,255,255,.35)}
  .bellbadge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
  .topsearch{flex:1;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:7px 12px;color:#fff;min-width:0;text-align:left}
  .topsearch .si{font-size:14px}
  .onboard{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;flex-direction:column;padding:calc(26px + env(safe-area-inset-top,0px)) 22px calc(20px + env(safe-area-inset-bottom,0px))}
  .onboard.on{display:flex}
  .ob-top{display:flex;justify-content:flex-end}
  .ob-skip{font-size:14px;font-weight:700;color:var(--muted)}
  .ob-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
  .ob-ic{width:118px;height:118px;border-radius:32px;background:var(--green-l);display:grid;place-items:center;font-size:56px}
  .ob-t{font-size:22px;font-weight:800}
  .ob-x{font-size:14.5px;color:var(--muted);max-width:330px;line-height:1.6}
  .ob-dots{display:flex;gap:7px;justify-content:center;margin:16px 0}
  .ob-dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
  .ob-dot.on{background:var(--green);width:22px;border-radius:5px}
  .card.hlcard{background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;border:none;position:relative;overflow:hidden;min-height:96px}
  .hlcard .hl-ic{font-size:26px}
  .hlcard .hl-t{font-size:16px;font-weight:800;margin-top:6px}
  .hlcard .hl-x{font-size:12.5px;opacity:.92;margin-top:3px}
  .hlcard .hl-dots{position:absolute;right:14px;bottom:10px;display:flex;gap:5px}
  .hlcard .hl-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45)}
  .hlcard .hl-dot.on{background:#fff}
  .quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 12px}
  .qbtn{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:5px}
  .qbtn .qi{font-size:21px}
  .qbtn .qt{font-size:10.5px;font-weight:700;color:var(--muted);text-align:center;line-height:1.2}
  .faq{border-bottom:1px solid var(--line);padding:11px 0}
  .faq summary{font-weight:700;font-size:14.5px;cursor:pointer;list-style:none}
  .faq summary::-webkit-details-marker{display:none}
  .faq p{font-size:13.5px;color:var(--muted);margin-top:7px;line-height:1.6}
  .chat-b{background:var(--soft);border-radius:12px;padding:9px 12px;font-size:13.5px;margin:6px 0;max-width:86%}
  .chat-u{background:var(--green-l);color:var(--green-d);border-radius:12px;padding:9px 12px;font-size:13.5px;margin:6px 0 6px auto;max-width:86%;text-align:right}
  main{padding:14px 14px 20px;max-width:760px;margin:0 auto}
  .view{display:none;animation:fade .18s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
  .card h3{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card h3 .sub{font-weight:400;color:var(--muted);font-size:12.5px}
  .card h3 .right{margin-left:auto;display:flex;gap:6px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .stat{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 14px;position:relative;overflow:hidden}
  .stat .lbl{font-size:12px;color:var(--muted);font-weight:600}
  .stat .val{font-size:20px;font-weight:800;margin-top:3px;letter-spacing:.2px}
  .stat .val small{font-size:13px;font-weight:600;color:var(--muted);margin-left:2px}
  .stat .ico{position:absolute;right:10px;top:10px;font-size:18px;opacity:.5}
  .stat.green .val{color:var(--green)} .stat.blue .val{color:var(--blue)}
  .stat.red .val{color:var(--red)} .stat.amber .val{color:var(--amber)}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);outline:none;transition:border-color .15s,box-shadow .15s}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-l)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:13px 16px;border-radius:12px;font-weight:700;font-size:15px;background:var(--green);color:#fff;transition:transform .06s,background .15s;width:100%}
  .btn:active{transform:scale(.985)}
  .btn.ghost{background:var(--green-l);color:var(--green-d)}
  .btn.grey{background:var(--soft);color:var(--ink)}
  .btn.wa{background:#25d366;color:#fff}
  .btn.sms{background:#3b6fd4;color:#fff}
  .btn.danger{background:var(--red-l);color:var(--red)}
  .btn.sm{padding:9px 13px;font-size:13.5px;width:auto;border-radius:10px}
  .btn.xs{padding:7px 9px;font-size:13px;width:auto;border-radius:9px}
  .btn-row{display:flex;gap:8px}
  .btn-row .btn{width:auto;flex:1}
  .seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
  .seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seg button.on{background:var(--card);color:var(--green-d);box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .seg.wrap{flex-wrap:wrap}
  .list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .list-item:last-child{border-bottom:none}
  .avatar{width:42px;height:42px;border-radius:12px;background:var(--green-l);color:var(--green-d);display:grid;place-items:center;font-weight:800;font-size:16px;flex:none;background-size:cover;background-position:center;overflow:hidden}
  .avatar.sup{background:var(--amber-l);color:var(--amber)}
  .avatar.lg{width:76px;height:76px;border-radius:18px;font-size:28px}
  .li-main{flex:1;min-width:0}
  .li-main .t{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .li-main .s{font-size:12.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .li-amt{text-align:right;flex:none}
  .li-amt .a{font-weight:800;font-size:15px}
  .li-amt .b{font-size:12px;color:var(--muted)}
  .li-amt .b.due{color:var(--red);font-weight:700}
  .li-amt .b.ok{color:var(--green);font-weight:700}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--green-l);color:var(--green-d);margin-left:6px}
  .tag.eve{background:var(--blue-l);color:var(--blue)}
  .tag.sup{background:var(--amber-l);color:var(--amber)}
  .tag.warn{background:var(--red-l);color:var(--red)}
  .empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
  .empty .big{font-size:34px;display:block;margin-bottom:8px;opacity:.6}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 2px calc(6px + var(--safe-b));box-shadow:0 -2px 14px rgba(16,40,30,.07)}
  nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 1px;color:var(--muted);font-size:10px;font-weight:600;border-radius:12px}
  nav.tabs button .ic{font-size:19px;line-height:1}
  nav.tabs button.on{color:var(--green-d)}
  .modal-bg{position:fixed;inset:0;background:rgba(12,30,22,.5);z-index:60;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
  .modal-bg.on{display:flex}
  .sheet{background:var(--card);width:100%;max-width:760px;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + var(--safe-b));max-height:92vh;overflow-y:auto;animation:up .22s cubic-bezier(.2,.8,.3,1)}
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .sheet-head h2{font-size:17px;font-weight:800}
  .sheet-head .x{width:34px;height:34px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:18px;color:var(--muted)}
  .handle{width:44px;height:5px;border-radius:5px;background:var(--line);margin:-4px auto 12px}
  .amt-preview{background:var(--green-l);border-radius:12px;padding:11px 13px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
  .amt-preview .k{font-size:13px;font-weight:600;color:var(--green-d)}
  .amt-preview .v{font-size:20px;font-weight:800;color:var(--green-d)}
  .bill-box{background:var(--dash);border:1px dashed var(--line);border-radius:14px;padding:14px}
  .bill-line{display:flex;justify-content:space-between;padding:6px 0;font-size:14.5px}
  .bill-line.tot{border-top:2px solid var(--ink);margin-top:6px;padding-top:9px;font-weight:800;font-size:16px}
  .bill-line .k{color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:#16241d;color:#fff;padding:11px 18px;border-radius:30px;font-size:13.5px;font-weight:600;z-index:120;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw;overflow:hidden;text-overflow:ellipsis}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast .tact{text-decoration:underline;font-weight:800;margin-left:8px;cursor:pointer}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}
  .divider{height:1px;background:var(--line);margin:12px 0}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{padding:7px 13px;border-radius:20px;background:var(--soft);font-size:13px;font-weight:700;color:var(--ink);cursor:pointer}
  .chip:active{background:var(--green-l);color:var(--green-d)}
  .chip.on{background:var(--green);color:#fff}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .fab{position:fixed;right:16px;bottom:calc(90px + var(--safe-b));z-index:35;width:58px;height:58px;border-radius:50%;background:var(--green);color:#fff;font-size:28px;display:grid;place-items:center;box-shadow:0 6px 18px rgba(15,123,83,.4);transition:transform .1s}
  .fab:active{transform:scale(.92)}
  .chart{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:6px}
  .chart .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
  .chart .bar .b{width:100%;background:var(--green);border-radius:7px 7px 3px 3px;min-height:3px;opacity:.9}
  .chart .bar .d{font-size:10.5px;color:var(--muted);font-weight:600}
  .chart .bar.today .b{background:var(--amber)}
  .sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .sw:last-child{border-bottom:none}
  .sw .lb{font-size:14.5px;font-weight:600}
  .sw .tr{width:52px;height:30px;border-radius:30px;background:var(--soft);position:relative;flex:none;transition:.2s}
  .sw .tr:after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:.2s}
  .sw .tr.on{background:var(--green)}
  .sw .tr.on:after{left:25px}
  .themes{display:flex;gap:10px;flex-wrap:wrap}
  .theme-dot{width:42px;height:42px;border-radius:50%;border:3px solid transparent;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .theme-dot.on{border-color:var(--ink)}
  .lock{position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,var(--green),var(--green-d));display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:14px;padding:24px}
  .lock.on{display:flex}
  #lock,#bioLock{z-index:240}
  .hub-head{font-size:13px;font-weight:800;color:var(--green-d);margin:16px 0 8px;letter-spacing:.2px}
  .hub-group:first-child .hub-head{margin-top:0}
  .hub-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:2px 0}
  .hub-head .hcnt{font-size:11.5px;font-weight:700;color:var(--muted);background:var(--soft);border-radius:20px;padding:2px 9px;margin-left:auto;margin-right:6px}
  .hub-head .hcaret{font-size:11px;color:var(--muted)}
  .hub-group.folded .tiles{display:none}
  .tile{position:relative}
  .tile .fav{position:absolute;top:4px;right:6px;font-size:11px;color:#e0a800}
  .ins{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;margin-bottom:8px;font-size:13.5px;background:var(--soft)}
  .ins.warn{background:#fdf3e7;color:#8a5a12}
  .ins.ok{background:var(--green-l);color:var(--green-d)}
  .ins .ii{font-weight:800;white-space:nowrap}
  .ai-row{display:flex;gap:8px;margin-top:8px}
  .ai-row input{flex:1}
  .lock .big{font-size:52px}
  .lock h2{font-size:19px;font-weight:700}
  .lock .dots{display:flex;gap:12px;margin:6px 0}
  .lock .dots i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.35)}
  .lock .dots i.f{background:#fff}
  .lock .bioic{font-size:64px;line-height:1}
  .lock .lbtn{background:#fff;color:var(--green-d);border-radius:14px;padding:13px 26px;font-weight:800;font-size:15px;width:230px}
  .lock .lbtn.ghost{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.45)}
  .pad{display:grid;grid-template-columns:repeat(3,74px);gap:12px;margin-top:8px}

function migrate(o){

    rateType:c.rateType||'liter',rate:c.rate||0,opening:c.opening||0,active:c.active!==false,photo:c.photo||'',
    defaultQty:c.defaultQty||0, route:c.route||'', items:c.items||[] }));

function itemById(p,id){ return p&&p.items?p.items.find(i=>i.id===id):null; }
function calcAmount(party,qty,fat,itemId,manualRate){
  qty=parseFloat(qty)||0; fat=parseFloat(fat)||0; let rate=parseFloat(manualRate);
  const it=itemById(party,itemId);
  if(isNaN(rate)||rate<=0){
    if(it){ rate=(it.rateType==='fat'&&fat>0)?fat*(parseFloat(it.rate)||0):(parseFloat(it.rate)||0); }
    else if(party&&party.rateType==='fat'&&fat>0){ rate=fat*(parseFloat(party.rate)||0); }
    else rate=party?(parseFloat(party.rate)||0):(state.settings.defaultRate||0);
  }
  let amount=Math.round(qty*rate*100)/100;
  if(state.settings.roundOff) amount=Math.round(amount);
  return {rate:Math.round(rate*100)/100,amount};
}
let IDX={party:{},date:{}};
function rebuildIndex(){
  const P={},D={};
  for(const e of state.entries){
    let p=P[e.partyId]; if(!p) p=P[e.partyId]={billed:0,paid:0,qty:0,sale:0,purch:0};
    p.billed+=e.amount; p.qty+=e.qty; if(e.kind==='sale') p.sale+=e.amount; else p.purch+=e.amount;
    let d=D[e.date]; if(!d) d=D[e.date]={qty:0,sale:0,purch:0,exp:0};
    d.qty+=e.qty; if(e.kind==='sale') d.sale+=e.amount; else d.purch+=e.amount;
  }
  for(const x of state.payments){ let p=P[x.partyId]; if(!p) p=P[x.partyId]={billed:0,paid:0,qty:0,sale:0,purch:0}; p.paid+=x.amount; }
  for(const x of state.expenses){ let d=D[x.date]; if(!d) d=D[x.date]={qty:0,sale:0,purch:0,exp:0}; d.exp+=x.amount; }
  IDX={party:P,date:D};
}
function partyBalance(id){
  const p=partyById(id); if(!p) return 0;
  const a=IDX.party[id]||{billed:0,paid:0};
  return (a.billed||0)+(parseFloat(p.opening)||0)-(a.paid||0);
}
function lastDay(y,m){ return new Date(y,m,0).getDate(); }
function rangeFor(type,anchor){
  const d=new Date(anchor+'T00:00:00'); const y=d.getFullYear(), m=d.getMonth()+1, day=d.getDate();
  const p2=n=>String(n).padStart(2,'0'); const mk=(yy,mm,dd)=>yy+'-'+p2(mm)+'-'+p2(dd);
  if(type==='day') return {start:anchor,end:anchor,label:fmtDate(anchor)};
  if(type==='week'){ const dow=(d.getDay()+6)%7; const s=new Date(d); s.setDate(d.getDate()-dow); const e=new Date(s); e.setDate(s.getDate()+6);
    return {start:ymd(s),end:ymd(e),label:fmtDate(ymd(s))+' – '+fmtDate(ymd(e))}; }
  if(type==='tenday'){ const seg=day<=10?1:day<=20?2:3; const s=seg===1?1:seg===2?11:21; const e=seg===1?10:seg===2?20:lastDay(y,m);
    return {start:mk(y,m,s),end:mk(y,m,e),label:fmtDate(mk(y,m,s))+' – '+fmtDate(mk(y,m,e))}; }
  if(type==='d10'){ return rangeFor('tenday',anchor); }
  if(type==='d15'){ const first=day<=15; const s=first?1:16, e=first?15:lastDay(y,m);
    return {start:mk(y,m,s),end:mk(y,m,e),label:fmtDate(mk(y,m,s))+' – '+fmtDate(mk(y,m,e))}; }
  if(type==='month'){ return {start:mk(y,m,1),end:mk(y,m,lastDay(y,m)),label:fmtMonth(y+'-'+p2(m))}; }
  if(type==='year'){ return {start:mk(y,1,1),end:mk(y,12,31),label:''+y}; }
  return {start:anchor,end:anchor,label:fmtDate(anchor)};
}
function inRange(date,start,end){ return date>=start&&date<=end; }
function isHoliday(date,partyId){
  return state.holidays.some(function(h){
    const same=h.date===date || (h.weekly && h.date && date && h.date.slice(5)===date.slice(5));
    return same && (h.partyId===''||h.partyId===partyId);
  });
}

  $('fab').style.display=(tab==='home'||tab==='entries')?'grid':'none';
  window.scrollTo({top:0,behavior:'instant'});
  if(tab==='home') renderHome();
  if(tab==='search') renderSearch();
  if(tab==='entries') renderEntries();
  if(tab==='parties') renderParties();

  if(tab==='more') renderHub();
  if(tab==='module'){ document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab==='more')); $('fab').style.display='none'; }

}

function renderHub(){
  if($('hubSearch')) $('hubSearch').placeholder=t('hub_search');
  if($('l-modHint')) $('l-modHint').textContent=t('hub_hint');
  if($('b-modMgr')) $('b-modMgr').textContent='⚙️ '+t('mod_mgr');
  const q=(($('hubSearch')&&$('hubSearch').value)||'').trim().toLowerCase();
  const hit=function(m){ if(!q) return true; return ((LANG==='hi'?m.hi:m.en)+' '+(LANG==='hi'?m.en:m.hi)).toLowerCase().indexOf(q)>=0; };
  const favs=(state.settings.favs||[]).map(function(id){ return MODULES.find(function(x){return x.id===id;}); }).filter(function(x){ return x && !isHiddenMod(x.id); });
  const rec=(state.settings.recent||[]).map(function(id){ return MODULES.find(function(x){return x.id===id;}); }).filter(function(x){ return x && !isHiddenMod(x.id); });
  let out='';
  if(!q && favs.length){
    out+='<div class="hub-group"><div class="hub-head"><span>'+t('favs')+'</span><span class="hcnt">'+favs.length+'</span><span class="hcaret"></span></div><div class="tiles">'+favs.map(hubTile).join('')+'</div></div>';
  }
  if(!q && rec.length){
    out+='<div class="hub-group"><div class="hub-head"><span>'+t('recent')+'</span><span class="hcnt">'+rec.length+'</span><span class="hcaret"></span></div><div class="tiles">'+rec.map(hubTile).join('')+'</div></div>';
  }
  if($('hubChips')) $('hubChips').innerHTML=GROUPS.map(function(g){
    const n=visibleMods().filter(function(m){ return (GMAP[m.id]||'app')===g.id; }).length;
    return '<button class="hchip" onclick="hubJump(\''+g.id+'\')">'+g.ic+' '+esc(LANG==='hi'?g.hi:g.en)+' · '+n+'</button>';
  }).join('');
  GROUPS.forEach(function(g){
    const all=visibleMods().filter(function(m){ return (GMAP[m.id]||'app')===g.id; });
    const items=all.filter(hit);
    if(!items.length) return;
    const folded=(state.settings.collapsed||[]).indexOf(g.id)>=0 && !q;
    out+='<div class="hub-group'+(folded?' folded':'')+'" id="g-'+g.id+'">'+hubHead(g,all.length,folded)+'<div class="tiles">'+items.map(hubTile).join('')+'</div></div>';
  });
  $('moduleTiles').innerHTML=out||('<div class="empty">'+t('no_data')+'</div>');
  bindHubTiles();
}
function bindHubTiles(){
  document.querySelectorAll('#moduleTiles .tile[data-mid]').forEach(function(el){
    const mid=el.getAttribute('data-mid');
    let timer=null;
    const fire=function(){ timer=null; _lpFired=true; toggleFav(mid); setTimeout(function(){ _lpFired=false; },700); };
    const down=function(){ if(timer) return; timer=setTimeout(fire,500); };
    const up=function(){ if(timer){ clearTimeout(timer); timer=null; } };
    el.addEventListener('touchstart',down,{passive:true});
    el.addEventListener('touchend',up);
    el.addEventListener('touchcancel',up);
    el.addEventListener('touchmove',up,{passive:true});
    el.addEventListener('mousedown',down);
    el.addEventListener('mouseup',up);
    el.addEventListener('mouseleave',up);
    el.addEventListener('click',function(e){
      if(_lpFired){ e.preventDefault(); e.stopPropagation(); return; }
      const m=MODULES.find(function(x){ return x.id===mid; });
      if(!m) return;
      if(m.jump) switchTab(m.jump); else openModule(m.id);
    });
  });
}

/* ================= HOME ================= */
function renderHome(){
  const today=todayStr(), m=monthStr();
  const tE=state.entries.filter(e=>e.date===today);
  const sale=tE.filter(e=>e.kind==='sale'), pur=tE.filter(e=>e.kind==='purchase');
  $('s-todaySale').innerHTML=num(sale.reduce((s,e)=>s+e.qty,0))+'<small>L</small> · '+money(sale.reduce((s,e)=>s+e.amount,0));
  $('s-todayPurchase').innerHTML=num(pur.reduce((s,e)=>s+e.qty,0))+'<small>L</small> · '+money(pur.reduce((s,e)=>s+e.amount,0));
  const mE=state.entries.filter(e=>e.date.startsWith(m));
  const mS=mE.filter(e=>e.kind==='sale').reduce((s,e)=>s+e.amount,0);
  const mP=mE.filter(e=>e.kind==='purchase').reduce((s,e)=>s+e.amount,0);
  const mX=state.expenses.filter(x=>x.date.startsWith(m)).reduce((s,x)=>s+x.amount,0);
  const mW=state.wastage.filter(x=>x.date.startsWith(m)).reduce((s,x)=>s+(x.value||0),0);
  $('s-monthProfit').textContent=money(mS-mP-mX-mW);
  $('s-receivable').textContent=money(state.parties.filter(p=>!isSup(p)).reduce((s,p)=>s+Math.max(0,partyBalance(p.id)),0));
  $('homeDateLbl').textContent=fmtDate(today);
  try{
    if($('heroDate')) $('heroDate').textContent=fmtDate(today);
    if($('heroBig')) $('heroBig').textContent=money(sale.reduce((s,e)=>s+e.amount,0));
    if($('heroLbl')) $('heroLbl').textContent=t('hero_today');
    const hM=state.entries.filter(e=>e.date===today&&e.kind==='sale'&&e.shift==='morning');
    const hE=state.entries.filter(e=>e.date===today&&e.kind==='sale'&&e.shift==='evening');
    if($('heroMorL')) $('heroMorL').textContent='🌅 '+t('morning');
    if($('heroEveL')) $('heroEveL').textContent='🌙 '+t('evening');
    if($('heroDueL')) $('heroDueL').textContent=t('hero_due');
    if($('heroMor')) $('heroMor').textContent=num(hM.reduce((s,e)=>s+e.qty,0))+' L · '+money(hM.reduce((s,e)=>s+e.amount,0));
    if($('heroEve')) $('heroEve').textContent=num(hE.reduce((s,e)=>s+e.qty,0))+' L · '+money(hE.reduce((s,e)=>s+e.amount,0));
    if($('heroDue')) $('heroDue').textContent=money(state.parties.filter(p=>!isSup(p)).reduce((s,p)=>s+Math.max(0,partyBalance(p.id)),0));
  }catch(e){}
  try{ renderSyncCard(); }catch(e){}
  renderChart(); renderLowStock(); renderTarget();
  const recent=tE.slice().sort((a,b)=>b.id.localeCompare(a.id));
  $('homeRecent').innerHTML=recent.length?recent.map(entryRow).join(''):'<div class="empty"><span class="big">🥛</span>'+t('no_entries_today')+'</div>';
  // today by customer
  const byC={}; sale.forEach(e=>{ const o=byC[e.partyId]||(byC[e.partyId]={q:0,a:0}); o.q+=e.qty; o.a+=e.amount; });
  const rows=Object.keys(byC).map(id=>({p:partyById(id),q:byC[id].q,a:byC[id].a})).filter(x=>x.p).sort((a,b)=>b.a-a.a);
  $('todayCustList').innerHTML=rows.length?rows.map(({p,q,a})=>`
    <div class="list-item" onclick="openBillDetail('${p.id}',rangeFor('day',todayStr()))">${avatarHtml(p)}
      <div class="li-main"><div class="t">${esc(p.name)}</div><div class="s">${num(q)} L</div></div>
      <div class="li-amt"><div class="a">${money(a)}</div></div></div>`).join(''):'<div class="empty">'+t('no_entries_today')+'</div>';
  const dues=state.parties.map(p=>({p,bal:partyBalance(p.id)})).filter(x=>x.bal>0.5).sort((a,b)=>b.bal-a.bal);
  $('homeDues').innerHTML=dues.length?dues.slice(0,10).map(({p,bal})=>`
      <div class="list-item" onclick="openBillDetail('${p.id}',rangeFor('month',todayStr()))">${avatarHtml(p)}
        <div class="li-main"><div class="t">${esc(p.name)}<span class="tag ${isSup(p)?'sup':''}">${isSup(p)?t('purchase'):t('sale')}</span></div><div class="s">${esc(p.phone||'')}</div></div>
        <div class="li-amt"><div class="b due">${money(bal)} ${isSup(p)?t('to_pay'):t('owes')}</div></div>
        ${p.phone?`<button class="btn wa xs" onclick="event.stopPropagation();waRemind('${p.id}')">🔔</button>`:''}</div>`).join('')
    :'<div class="empty"><span class="big">✅</span>'+t('no_dues')+'</div>';
  renderHighlights(); updateBell(); renderShiftCard();
}
function renderChart(){
  const days=[], now=new Date();
  for(let i=6;i>=0;i--){ const d=new Date(now); d.setDate(now.getDate()-i); days.push(d); }
  const vals=days.map(d=>{ const ds=ymd(d); return (IDX.date[ds]||{}).sale||0; });
  const max=Math.max(1,...vals);
  $('chart7').innerHTML=days.map((d,i)=>`<div class="bar ${i===6?'today':''}"><div class="b" style="height:${Math.max(4,Math.round(vals[i]/max*88))}%"></div><div class="d">${DOW[LANG][d.getDay()]}</div></div>`).join('');
}
function renderLowStock(){
  const low=state.items.filter(it=>it.min>0 && stockOf(it.id)<it.min);
  if(!low.length){ $('lowStockCard').style.display='none'; return; }
  $('lowStockCard').style.display='block';
  $('lowStockList').innerHTML=low.map(it=>`<div class="list-item"><div class="avatar" style="background:var(--red-l);color:var(--red)">📦</div>
    <div class="li-main"><div class="t">${esc(it.name)}</div><div class="s">${t('stock_qty')}: ${num(stockOf(it.id))} ${esc(it.unit||'')}</div></div>
    <div class="li-amt"><div class="b due">${t('low_stock')}</div></div></div>`).join('');
}
function renderTarget(){
  const tgt=state.settings.target||0, card=$('targetCard');
  if(!tgt){ card.style.display='none'; return; }
  card.style.display='block';
  const month=monthStr(); const sale=(state.entries.filter(e=>e.date.startsWith(month)&&e.kind==='sale').reduce((s,e)=>s+e.amount,0));
  const pct=Math.min(100,Math.round(sale/tgt*100));
  $('targetBar').style.width=pct+'%';
  $('targetTxt').textContent=sale>=tgt?('🎉 '+money(sale)):(money(sale)+' / '+money(tgt)+' ('+pct+'%)');
}
function entryRow(e){
  const p=partyById(e.partyId), sup=isSup(p), it=itemById(p,e.itemId);
  const itTag=it?`<span class="tag">${esc(it.name)}</span>`:'';
  const pend=(state.settings.driveAuto && !e.syncAt)?`<span class="tag pend" title="${t('sync_pending')}">⏳</span>`:'';
  const ph=(p&&p.phone)?p.phone:'';
  return `<div class="list-item">
    <div class="avatar ${sup?'sup':''}">${sup?'🚚':'🥛'}</div>
    <div class="li-main" onclick="openEntry('${e.id}')">
      <div class="t">${esc(partyName(e.partyId))}<span class="tag ${e.shift==='evening'?'eve':''}">${shiftLbl(e.shift)}</span>${itTag}<span class="tag ${sup?'sup':''}">${sup?t('purchase'):t('sale')}</span>${pend}</div>
      <div class="s">${num(e.qty)} L${e.fat?' • '+t('fat_short')+' '+num(e.fat):''} • ${cur()}${num(e.rate)}/L</div>
    </div>
    <div class="li-amt" onclick="openEntry('${e.id}')"><div class="a">${money(e.amount)}</div></div>
    ${ph?`<button class="btn grey xs" onclick="event.stopPropagation();callParty('${p.id}')">📞</button><button class="btn wa xs" onclick="event.stopPropagation();waParty('${p.id}')">💬</button>`:''}
    <button class="btn grey xs" onclick="event.stopPropagation();openEntry('${e.id}')">✏️</button>
    <button class="btn danger xs" onclick="delEntry('${e.id}')">🗑</button>
  </div>`;
}

/* ================= ENTRIES ================= */
let uiShift='';
function setShift(s){ uiShift=s; renderShiftSeg(); renderEntries(); }
function renderShiftSeg(){ if(!$('shf-all')) return;
  $('shf-all').textContent=t('shift_all'); $('shf-m').textContent=t('morning'); $('shf-e').textContent=t('evening');
  $('shf-all').classList.toggle('on',uiShift===''); $('shf-m').classList.toggle('on',uiShift==='morning'); $('shf-e').classList.toggle('on',uiShift==='evening'); }
function openEntryShift(shift){ openEntry(); if($('f_shift')) $('f_shift').value=shift; }
function renderEntries(){
  const d=$('entryDate').value||todayStr();
  const q=($('entrySearch')?$('entrySearch').value:'').trim().toLowerCase();
  let list;
  if(q){ const m=d.slice(0,7); list=state.entries.filter(e=>e.date.startsWith(m)&&partyName(e.partyId).toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date)); }
  else list=state.entries.filter(e=>e.date===d).sort((a,b)=>a.shift.localeCompare(b.shift));
  if(uiShift) list=list.filter(e=>e.shift===uiShift);
  const box=$('entriesList');
  if(!list.length){ box.innerHTML='<div class="empty"><span class="big">📭</span>'+t('no_entries_date')+'</div>'; return; }
  const qty=list.reduce((s,e)=>s+e.qty,0), amt=list.reduce((s,e)=>s+e.amount,0);
  box.innerHTML=list.map(entryRow).join('')+`<div class="bill-line tot" style="margin-top:10px"><span class="k">${t('total')}</span><span class="v">${num(qty)} L • ${money(amt)}</span></div>`;
}
function delEntry(id){
  const rec=state.entries.find(e=>e.id===id); if(!rec) return;
  state.entries=state.entries.filter(e=>e.id!==id);
  save(); renderEntries(); renderHome(); rerenderModule();
  toast(t('deleted_undo'),t('undo'),()=>{ state.entries.push(rec); save(); renderEntries(); renderHome(); rerenderModule(); });
}
function entryItemOptions(p,sel){
  if(!p||!p.items||!p.items.length) return '';
  return p.items.map((i,idx)=>`<option value="${i.id}" ${(sel?sel===i.id:idx===0)?'selected':''}>${esc(i.name)}</option>`).join('');
}
function openEntry(id){
  const edit=id?state.entries.find(e=>e.id===id):null;
  if(!state.parties.length){ toast(t('add_party_first')); switchTab('parties'); openParty(); return; }
  const d=edit?edit.date:($('entryDate').value||todayStr());
  const defShift=edit?edit.shift:((state.settings.autoShift!==false)?autoShift():state.settings.defaultShift);
  window._qtyAuto=false;
  const first=edit?edit.partyId:state.parties[0].id;
  const opts=state.parties.filter(p=>p.active!==false).map(p=>`<option value="${p.id}" ${first===p.id?'selected':''}>${esc(p.name)} — ${isSup(p)?t('purchase'):t('sale')}</option>`).join('');
  openModal(`
    <div class="sheet-head"><h2>${edit?t('edit_entry'):t('new_entry')}</h2><button class="x" onclick="closeModal()">✕</button></div>
    <div class="field"><label>${t('party_lbl')}</label><select id="f_party" onchange="onEntryParty()">${opts}</select></div>
    <div class="btn-row" style="margin:-4px 0 8px">
      <button class="btn grey sm" onclick="entryNav(-1)">◀ ${t('prev')}</button>
      <button class="btn grey sm" onclick="entryNav(1)">${t('next')} ▶</button>
    </div>
    <div class="field" id="f_itemWrap" style="display:none"><label>${t('item_lbl')}</label><select id="f_item" onchange="previewAmt()"></select></div>
    <div class="row2">
      <div class="field"><label>${t('date')}</label><input type="date" id="f_date" value="${d}" /></div>
      <div class="field"><label>${t('shift')}</label><select id="f_shift">
        <option value="morning" ${defShift!=='evening'?'selected':''}>${t('morning')}</option>
        <option value="evening" ${defShift==='evening'?'selected':''}>${t('evening')}</option></select></div>
    </div>
    ${edit?'':`<div class="hint" id="entryWhen" style="margin:-2px 0 8px"></div>`}
    <div class="field" style="margin-bottom:8px"><label>${t('quick_qty')}</label><div class="chips">${[0.5,1,1.5,2,2.5,3,4,5].map(v=>`<span class="chip" onclick="setQty(${v})">${v}</span>`).join('')}</div></div>
    <div class="row2">
      <div class="field"><label>${t('qty')}</label><input type="number" step="0.01" inputmode="decimal" id="f_qty" value="${edit?edit.qty:''}" placeholder="${t('qty_ph')}" oninput="previewAmt()" /></div>
      <div class="field"><label>${t('fat')}</label><input type="number" step="0.1" inputmode="decimal" id="f_fat" value="${edit&&edit.fat?edit.fat:''}" placeholder="${t('fat_ph')}" oninput="previewAmt()" /></div>
    </div>
    <div class="field"><label>${t('rate_optional')}</label><input type="number" step="0.01" inputmode="decimal" id="f_rate" value="${edit?edit.rate:''}" placeholder="auto" oninput="previewAmt()" /></div>
    <div class="amt-preview"><span class="k">${t('total_amount')}</span><span class="v" id="f_amt">${cur()}0</span></div>
    <div class="btn-row">
      ${edit?`<button class="btn danger" onclick="delEntry('${edit.id}');closeModal()">${t('del')}</button>`:''}
      <button class="btn" onclick="saveEntry(${edit?"'"+edit.id+"'":'null'})">${t('save')}</button>
    </div>`);
  onEntryParty(edit?edit.itemId:'');
  try{ tickClock(); }catch(e){}
}
function onEntryParty(itemSel){
  const p=partyById($('f_party').value), q=$('f_qty');
  const iw=$('f_itemWrap'), is=$('f_item');
  if(p&&p.items&&p.items.length){ iw.style.display='block'; is.innerHTML=entryItemOptions(p,itemSel); }
  else { iw.style.display='none'; }
  if(q&&(window._qtyAuto||!q.value)){ if(p&&p.defaultQty){ q.value=p.defaultQty; window._qtyAuto=true; } else if(window._qtyAuto){ q.value=''; window._qtyAuto=false; } }
  previewAmt();
}
function setQty(v){ const el=$('f_qty'); if(el){ el.value=v; window._qtyAuto=false; previewAmt(); } }
function previewAmt(){
  const p=partyById($('f_party').value);
  const itemId=($('f_item')&&$('f_itemWrap').style.display!=='none')?$('f_item').value:'';
  const r=calcAmount(p,$('f_qty').value,$('f_fat').value,itemId,$('f_rate').value);
  $('f_amt').textContent=money2(r.amount);
}
function saveEntry(id){
  const partyId=$('f_party').value, p=partyById(partyId);
  const date=$('f_date').value||todayStr(), shift=$('f_shift').value;
  const itemId=($('f_item')&&$('f_itemWrap').style.display!=='none')?$('f_item').value:'';
  const qty=parseFloat($('f_qty').value), fat=parseFloat($('f_fat').value)||0;
  if(!qty||qty<=0){ toast(t('enter_qty')); return; }
  const r=calcAmount(p,qty,fat,itemId,$('f_rate').value);
  const rec={id:id||uid(),date,partyId,itemId,kind:isSup(p)?'purchase':'sale',shift,qty,fat,rate:r.rate,amount:r.amount};
  const dup=state.entries.find(e=>e.partyId===partyId&&e.date===date&&e.shift===shift&&(e.itemId||'')===(itemId||'')&&e.id!==(id||''));
  if(dup){ if(!confirm(t('dup_warn'))) return; state.entries=state.entries.filter(e=>e.id!==dup.id); }
  if(id) state.entries[state.entries.findIndex(e=>e.id===id)]=rec; else state.entries.push(rec);
  save(); closeModal(); toast(id?t('entry_updated'):t('entry_saved'));
  renderEntries(); renderHome(); rerenderModule();
}
function openBulk(){
  let custs=state.parties.filter(p=>p.type==='customer'&&p.active!==false);
  if(!custs.length){ toast(t('no_customers')); return; }
  const routes=[...new Set(custs.map(c=>c.route).filter(Boolean))];
  const rf=window._bulkRoute||'';
  if(rf) custs=custs.filter(c=>c.route===rf);
  const rows=custs.map(c=>`<div class="list-item" style="padding:8px 0">
      <div class="li-main"><div class="t">${esc(c.name)}</div><div class="s">${c.rateType==='fat'?cur()+num(c.rate)+t('rate_per_f'):cur()+num(c.rate)+t('rate_per_l')}</div></div>
      <input type="number" step="0.01" inputmode="decimal" id="bk_${c.id}" value="${c.defaultQty?c.defaultQty:''}" placeholder="0" style="width:92px;padding:9px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);text-align:right" /></div>`).join('');
  openModal(`
    <div class="sheet-head"><h2>${t('bulk_entry')}</h2><button class="x" onclick="closeModal()">✕</button></div>
    <div class="hint" style="margin-bottom:10px">${t('bulk_hint')}</div>
    ${routes.length?`<div class="field"><label>${t('route_filter')}</label><select id="bk_route" onchange="window._bulkRoute=this.value;openBulk()"><option value="">${t('all_routes')}</option>${routes.map(r=>`<option ${rf===r?'selected':''}>${esc(r)}</option>`).join('')}</select></div>`:''}
    <div class="row2">
      <div class="field"><label>${t('date')}</label><input type="date" id="bk_date" value="${($('entryDate')?$('entryDate').value:'')||todayStr()}" /></div>
      <div class="field"><label>${t('shift')}</label><select id="bk_shift">
        <option value="morning" ${state.settings.defaultShift!=='evening'?'selected':''}>${t('morning')}</option>
        <option value="evening" ${state.settings.defaultShift==='evening'?'selected':''}>${t('evening')}</option></select></div>
    </div>
    <div class="field"><label>${t('bulk_rate')}</label><input type="number" step="0.01" inputmode="decimal" id="bk_rate" placeholder="auto" /></div>
    <div class="divider"></div>${rows}
    <button class="btn" style="margin-top:14px" onclick="saveBulk()">${t('bulk_save')}</button>`);
}
function saveBulk(){
  const date=$('bk_date').value||todayStr(), shift=$('bk_shift').value, rate=$('bk_rate').value; let n=0;
  state.parties.filter(p=>p.type==='customer'&&p.active!==false).forEach(c=>{
    const el=$('bk_'+c.id); if(!el) return; const qty=parseFloat(el.value); if(!qty||qty<=0) return;
    const r=calcAmount(c,qty,0,'',rate);
    state.entries.push({id:uid(),date,partyId:c.id,itemId:'',kind:'sale',shift,qty,fat:0,rate:r.rate,amount:r.amount}); n++;
  });
  if(!n){ toast(t('bulk_none')); return; }
  save(); closeModal(); toast(n+' × '+t('bulk_saved')); renderEntries(); renderHome(); rerenderModule();
}
function autoDefaultEntries(){
  const today=$('entryDate').value||todayStr();
  const shift=state.settings.defaultShift||'morning';
  const cand=state.parties.filter(p=>p.type==='customer'&&p.active!==false&&((p.defaultQty||0)>0||(p.defaultQtyAm||0)>0||(p.defaultQtyPm||0)>0));
  if(!cand.length){ toast(t('auto_default_none')); return; }
  const todo=cand.filter(c=>!state.entries.some(e=>e.partyId===c.id&&e.date===today));
  if(!todo.length){ toast(t('bulk_none')); return; }
  if(!confirm(t('auto_default_confirm').replace('{n}',todo.length))) return;
  todo.forEach(c=>{ const q=defQtyFor(c,shift); const r=calcAmount(c,q,0,'',''); state.entries.push({id:uid(),date:today,partyId:c.id,itemId:'',kind:'sale',shift,qty:q,fat:0,rate:r.rate,amount:r.amount}); });
  save(); renderEntries(); renderHome(); rerenderModule(); toast(todo.length+' × '+t('auto_default_done'));
}
function copyPrevDay(){
  const sel=$('entryDate').value||todayStr();
  const dates=[...new Set(state.entries.map(e=>e.date))].filter(d=>d<sel).sort();
  if(!dates.length){ toast(t('no_entries_today')); return; }
  const src=dates[dates.length-1]; const srcEntries=state.entries.filter(e=>e.date===src);
  if(!srcEntries.length){ toast(t('no_entries_today')); return; }
  if(state.entries.some(e=>e.date===sel) && !confirm(t('c_load_backup'))) return;
  srcEntries.forEach(e=>{ state.entries.push({...e, id:uid(), date:sel}); });
  save(); renderEntries(); renderHome(); toast(srcEntries.length+' × '+t('entry_saved'));
}
function shareTodaySummary(){
  const today=$('entryDate').value||todayStr();
  const e=state.entries.filter(x=>x.date===today);
  const sale=e.filter(x=>x.kind==='sale'), pur=e.filter(x=>x.kind==='purchase');
  const txt='🥛 '+shopName()+'\n'+t('summary_today')+' — '+fmtDate(today)+'\n────────────\n'
    +t('sale')+': '+num(sale.reduce((s,x)=>s+x.qty,0))+' L • '+money(sale.reduce((s,x)=>s+x.amount,0))+'\n'
    +t('purchase')+': '+num(pur.reduce((s,x)=>s+x.qty,0))+' L • '+money(pur.reduce((s,x)=>s+x.amount,0))+'\n'
    +t('entry_count')+': '+e.length+'\n────────────\n'+t('thank');
  if(navigator.share) navigator.share({title:t('summary_today'),text:txt}).catch(()=>{});
  else { if(navigator.clipboard) navigator.clipboard.writeText(txt).catch(()=>{}); toast(t('copied')); }
}

/* ================= PARTIES ================= */
function setPartyType(tp){ uiPartyType=tp; uiRoute=''; renderParties(); }
function setRoute(r){ uiRoute=r; renderParties(); }
function renderRouteChips(){
  const el=$('routeChips'); if(!el) return;
  const routes=[...new Set(state.parties.filter(p=>p.type===uiPartyType).map(p=>p.route).filter(Boolean))];
  el.innerHTML=routes.length?`<span class="chip ${uiRoute===''?'on':''}" onclick="setRoute('')">${t('all_routes')}</span>`
    +routes.map(r=>`<span class="chip ${uiRoute===r?'on':''}" onclick='setRoute(${JSON.stringify(r)})'>${esc(r)}</span>`).join(''):'';
}
function renderParties(){
  $('seg-cust').classList.toggle('on',uiPartyType==='customer');
  $('seg-sup').classList.toggle('on',uiPartyType==='supplier');
  $('b-addParty').textContent=uiPartyType==='supplier'?t('add_farmer'):t('add_customer');
  renderRouteChips();
  const q=($('partySearch').value||'').trim().toLowerCase();
  let list=state.parties.filter(p=>p.type===uiPartyType);
  if(uiRoute) list=list.filter(p=>p.route===uiRoute);
  if(q) list=list.filter(p=>(p.name||'').toLowerCase().includes(q)||(p.phone||'').includes(q));
  list.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const box=$('partiesList');
  if(!list.length){ box.innerHTML='<div class="empty"><span class="big">👥</span>'+(state.parties.filter(p=>p.type===uiPartyType).length?t('no_match'):t('no_parties'))+'</div>'; return; }
  box.innerHTML=list.map(p=>{
    const bal=partyBalance(p.id);

function pickPhoto(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; shrink(f,200,d=>{ window._photo=d; $('photoBox').innerHTML=`<div class="avatar lg" style="background-image:url('${d}')"></div>`; }); };
  inp.click();
}
function shrink(file,max,cb){
  const r=new FileReader();
  r.onload=()=>{ const img=new Image(); img.onload=()=>{ const s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); cb(c.toDataURL('image/jpeg',0.75)); }; img.src=r.result; };
  r.readAsDataURL(file);
}

function delParty(id){
  const has=state.entries.some(e=>e.partyId===id)||state.payments.some(p=>p.partyId===id);
  if(has&&!confirm(t('c_del_party_entries'))) return;

  state.parties=state.parties.filter(p=>p.id!==id);

  state.payments=state.payments.filter(p=>p.partyId!==id);

  const sale=e.filter(x=>x.kind==='sale'), pur=e.filter(x=>x.kind==='purchase');
  const qty=sale.reduce((s,x)=>s+x.qty,0), saleAmt=sale.reduce((s,x)=>s+x.amount,0);
  const purAmt=pur.reduce((s,x)=>s+x.amount,0), paid=pays.reduce((s,x)=>s+x.amount,0);
  $('bs-qty').textContent=num(qty)+' L'; $('bs-sale').textContent=money(saleAmt);

function dataUrlToBytes(u){ const b=atob(u.split(',')[1]); const a=new Uint8Array(b.length); for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i); return a; }
function buildPdfMulti(pages){
  const enc=s=>{ const a=new Uint8Array(s.length); for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i)&0xff; return a; };
  const parts=[],offsets=[]; let pos=0;
  const push=u8=>{ parts.push(u8); pos+=u8.length; }; const ps=s=>push(enc(s));
  ps('%PDF-1.4\n');
  const obj=(n,body,stream)=>{ offsets[n]=pos; ps(n+' 0 obj\n'+body+'\n'); if(stream){ ps('stream\n'); push(stream); ps('\nendstream\n'); } ps('endobj\n'); };
  const N=pages.length;
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  const kids=[]; for(let i=0;i<N;i++) kids.push((3+i*3)+' 0 R');
  obj(2,'<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+N+' >>');
  for(let i=0;i<N;i++){
    const pg=pages[i], pageObj=3+i*3, imgObj=pageObj+1, contObj=pageObj+2;
    obj(pageObj,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pg.w+' '+pg.h+'] /Resources << /XObject << /Im0 '+imgObj+' 0 R >> >> /Contents '+contObj+' 0 R >>');
    obj(imgObj,'<< /Type /XObject /Subtype /Image /Width '+pg.iw+' /Height '+pg.ih+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+pg.bytes.length+' >>',pg.bytes);
    const content=enc('q '+pg.w+' 0 0 '+pg.h+' 0 0 cm /Im0 Do Q');
    obj(contObj,'<< /Length '+content.length+' >>',content);
  }
  const total=N*3+3;
  const xref=pos; let x='xref\n0 '+total+'\n0000000000 65535 f \n';
  for(let i=1;i<total;i++) x+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';
  x+='trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF'; ps(x);
  const totalLen=parts.reduce((s,p)=>s+p.length,0); const out=new Uint8Array(totalLen); let o=0; parts.forEach(p=>{ out.set(p,o); o+=p.length; }); return out;
}

function upiUri(amount){

  return 'upi://pay?pa='+encodeURIComponent(vpa)+'&pn='+encodeURIComponent(pn)+'&am='+encodeURIComponent((Math.round((amount||0)*100)/100).toFixed(2))+'&cu=INR&tn='+encodeURIComponent(t('bill_title'));
}
function qrMatrix(text){ const qr=qrcode(0,'M'); qr.addData(text); qr.make(); return qr; }
function drawQrTo(g,text,x,y,size,quiet){
  const qr=qrMatrix(text); const n=qr.getModuleCount(); const q=quiet||2; const total=n+q*2; const cell=size/total;
  g.fillStyle='#fff'; g.fillRect(x,y,size,size); g.fillStyle='#000';
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(qr.isDark(r,c)) g.fillRect(Math.floor(x+(c+q)*cell),Math.floor(y+(r+q)*cell),Math.ceil(cell),Math.ceil(cell));
}

function runBulkMonthly(){
  const month=$('bm_month').value||monthStr(); const shift=$('bm_shift').value; const ov=parseFloat($('bm_qty').value)||0;
  const [yy,mm]=month.split('-').map(Number); const days=lastDay(yy,mm);

  let n=0;
  state.parties.filter(p=>p.type==='customer'&&p.active!==false).forEach(c=>{
    const qty=ov||c.defaultQty; if(!qty||qty<=0) return;
    for(let day=1;day<=days;day++){ const ds=month+'-'+String(day).padStart(2,'0');

      shifts.forEach(sh=>{
        if(state.entries.some(e=>e.partyId===c.id&&e.date===ds&&e.shift===sh)) return;
        const r=calcAmount(c,qty,0,'','');

function reportData(type,anchor){
  const d=new Date(anchor+'T00:00:00'), y=d.getFullYear(), m=d.getMonth()+1; const p2=n=>String(n).padStart(2,'0');

      const pu=e.filter(x=>x.kind==='purchase').reduce((s,x)=>s+x.amount,0); const ex=state.expenses.filter(x=>x.date===ds).reduce((s,x)=>s+x.amount,0);
      if(q||sa||pu||ex) rows.push({label:fmtDate(ds),q,sale:sa,purch:pu,exp:ex,profit:sa-pu-ex,extra:''}); }

      const sa=e.filter(x=>x.kind==='sale').reduce((s,x)=>s+x.amount,0); const pu=e.filter(x=>x.kind==='purchase').reduce((s,x)=>s+x.amount,0);
      const ex=state.expenses.filter(x=>x.date.startsWith(pre)).reduce((s,x)=>s+x.amount,0);
      if(q||sa||pu||ex) rows.push({label:MONTHS[LANG][mm-1],q,sale:sa,purch:pu,exp:ex,profit:sa-pu-ex,extra:''}); }
    return {start,end,label:''+y,rows,group:'month'}; }
  if(type==='yearwise'){ const years={}; state.entries.forEach(x=>{years[x.date.slice(0,4)]=1;});
    const rows=Object.keys(years).sort().map(yy=>{ const e=state.entries.filter(x=>x.date.startsWith(yy)); const q=e.reduce((s,x)=>s+x.qty,0);
      const sa=e.filter(x=>x.kind==='sale').reduce((s,x)=>s+x.amount,0); const pu=e.filter(x=>x.kind==='purchase').reduce((s,x)=>s+x.amount,0);
      const ex=state.expenses.filter(x=>x.date.startsWith(yy)).reduce((s,x)=>s+x.amount,0); return {label:yy,q,sale:sa,purch:pu,exp:ex,profit:sa-pu-ex,extra:''}; });
    return {start:'0000-01-01',end:'9999-12-31',label:t('rep_yearwise'),rows,group:'year'}; }
  if(type==='partyyear'){ const pre=''+y; const e=state.entries.filter(x=>x.date.startsWith(pre));
    const rows=state.parties.map(p=>{ const pe=e.filter(x=>x.partyId===p.id); const q=pe.reduce((s,x)=>s+x.qty,0);
      const sa=pe.filter(x=>x.kind==='sale').reduce((s,x)=>s+x.amount,0); const pu=pe.filter(x=>x.kind==='purchase').reduce((s,x)=>s+x.amount,0);
      return {label:p.name,sup:isSup(p),q,sale:sa,purch:pu,exp:0,profit:sa-pu,extra:isSup(p)?'':money(partyBalance(p.id))}; }).filter(x=>x.q||x.sale||x.purch);
    return {start:pre+'-01-01',end:pre+'-12-31',label:pre,rows,group:'party'}; }
  const r=rangeFor(type,anchor);
  const e=state.entries.filter(x=>inRange(x.date,r.start,r.end));
  const rows=state.parties.map(p=>{ const pe=e.filter(x=>x.partyId===p.id); const q=pe.reduce((s,x)=>s+x.qty,0);
    const sa=pe.filter(x=>x.kind==='sale').reduce((s,x)=>s+x.amount,0); const pu=pe.filter(x=>x.kind==='purchase').reduce((s,x)=>s+x.amount,0);
    return {label:p.name,sup:isSup(p),q,sale:sa,purch:pu,exp:0,profit:sa-pu,extra:isSup(p)?'':money(partyBalance(p.id))}; }).filter(x=>x.q||x.sale||x.purch);
  return {start:r.start,end:r.end,label:r.label,rows,group:'party'};
}

function pnlData(period,anchor){
  const d=new Date(anchor+'T00:00:00'), y=d.getFullYear(); const p2=n=>String(n).padStart(2,'0');
  const pre=period==='year'?(''+y):(y+'-'+p2(d.getMonth()+1));
  const e=state.entries.filter(x=>x.date.startsWith(pre));
  const income=e.filter(x=>x.kind==='sale').reduce((s,x)=>s+x.amount,0);
  const purchase=e.filter(x=>x.kind==='purchase').reduce((s,x)=>s+x.amount,0);
  const byCat={}; state.expenses.filter(x=>x.date.startsWith(pre)).forEach(x=>{ byCat[x.cat]=(byCat[x.cat]||0)+x.amount; });
  const expTotal=Object.values(byCat).reduce((s,v)=>s+v,0);
  const wastage=state.wastage.filter(x=>x.date.startsWith(pre)).reduce((s,x)=>s+(x.value||0),0);
  return {pre,label:period==='year'?(''+y):fmtMonth(pre),income,purchase,gross:income-purchase,byCat,expTotal,wastage,net:income-purchase-expTotal-wastage};
}

function b64buf(u8){ let s=''; const CH=0x8000; for(let i=0;i<u8.length;i+=CH) s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH)); return btoa(s); }
function buf64(b){ const s=atob(b); const u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }
async function encKey(pass,salt){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function exportEncrypted(){
  try{
    const pass=prompt(t('enc_pass')); if(!pass) return;
    const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
    const key=await encKey(pass,salt);
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,new TextEncoder().encode(JSON.stringify(state)));
    const out={v:1,app:'milk-hisaab',salt:b64buf(salt),iv:b64buf(iv),data:b64buf(new Uint8Array(ct))};
    const blob=new Blob([JSON.stringify(out)],{type:'application/octet-stream'});
    const fname='milk-backup-'+todayStr()+'.milk';
    const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=fname; document.body.appendChild(a); a.click();
    setTimeout(function(){ try{ URL.revokeObjectURL(url); a.remove(); }catch(e){} },1500);

}

  const inp=document.createElement('input'); inp.type='file'; inp.accept='.milk,application/octet-stream,application/json';
  inp.onchange=async function(){
    const f=inp.files[0]; if(!f) return;
    try{
      const pass=prompt(t('enc_pass')); if(!pass) return;
      const obj=JSON.parse(await f.text());
      const key=await encKey(pass,buf64(obj.salt));
      const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf64(obj.iv)},key,buf64(obj.data));
      const data=JSON.parse(new TextDecoder().decode(pt));
      if(!data||!data.parties){ toast(t('enc_bad')); return; }
      if(!confirm(t('enc_confirm'))) return;
      state=migrate(data); save(); toast('🔓 '+t('enc_restored')); location.reload();
    }catch(e){ toast(t('enc_bad')); }
  };

}

function crc32(buf){ let crc=0xFFFFFFFF;
  for(let i=0;i<buf.length;i++){ crc^=buf[i]; for(let j=0;j<8;j++) crc=(crc>>>1)^(0xEDB88320 & -(crc&1)); }
  return (crc^0xFFFFFFFF)>>>0; }
function zipStore(files){
  const enc=new TextEncoder(), chunks=[], central=[]; let offset=0;
  files.forEach(function(f){
    const nb=enc.encode(f.name), crc=crc32(f.data), size=f.data.length;
    const lh=new Uint8Array(30+nb.length), dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true); dv.setUint16(4,20,true); dv.setUint16(8,0,true); dv.setUint32(14,crc,true);
    dv.setUint32(18,size,true); dv.setUint32(22,size,true); dv.setUint16(26,nb.length,true); lh.set(nb,30);
    chunks.push(lh,f.data);
    const ch=new Uint8Array(46+nb.length), cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,size,true); cv.setUint32(24,size,true);
    cv.setUint16(28,nb.length,true); cv.setUint32(42,offset,true); ch.set(nb,46);
    central.push(ch); offset+=lh.length+size;
  });
  const cdSize=central.reduce((s,c)=>s+c.length,0);
  const end=new Uint8Array(22), ev=new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,cdSize,true); ev.setUint32(16,offset,true);
  const all=chunks.concat(central,[end]); const total=all.reduce((s,c)=>s+c.length,0);
  const out=new Uint8Array(total); let o=0; all.forEach(c=>{ out.set(c,o); o+=c.length; }); return out;
}

let fsHandle=null;
function idbOpen(){ return new Promise((res,rej)=>{ try{ const r=indexedDB.open('milkdb',1); r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains('kv')) r.result.createObjectStore('kv'); }; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); }
async function idbSet(k,v){ const db=await idbOpen(); return new Promise((res,rej)=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }
async function idbGet(k){ const db=await idbOpen(); return new Promise((res,rej)=>{ const t=db.transaction('kv','readonly'); const q=t.objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
async function idbDel(k){ const db=await idbOpen(); return new Promise((res)=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').delete(k); t.oncomplete=()=>res(); }); }
async function loadHandle(){ try{ fsHandle=(await idbGet('backupFile'))||null; }catch(e){ fsHandle=null; } cloudStatus(); }
function cloudStatus(){ const el=$('cloudStatus'); if(!el) return; el.textContent=fsHandle?((fsHandle.name||'file')+(state.settings.lastExport?' · '+fmtDate(ymd(new Date(state.settings.lastExport))):'')):t('no_link'); }
function download(name,content,type){
  try{ if(window.MilkNative&&window.MilkNative.saveText){ window.MilkNative.saveText(name, (typeof content==='string')?content:JSON.stringify(content)); toast(t('saved')); return; } }catch(e){}
  const blob=new Blob([content],{type:type||'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},100);
}
function shareBackup(){
  const data=JSON.stringify(state,null,2); state.settings.lastExport=Date.now(); try{ localStorage.setItem(STORE_KEY,JSON.stringify(state)); }catch(e){}
  const file=new File([data],'milk-backup-'+todayStr()+'.json',{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){ navigator.share({files:[file],title:'Milk backup'}).then(()=>{ toast(t('cloud_saved')); renderBackupReminder(); cloudStatus(); }).catch(()=>{}); return; }

  try{ let perm='granted'; if(fsHandle.queryPermission){ perm=await fsHandle.queryPermission({mode:'readwrite'}); if(perm!=='granted'&&fsHandle.requestPermission) perm=await fsHandle.requestPermission({mode:'readwrite'}); }
    if(perm!=='granted') return false; const w=await fsHandle.createWritable(); await w.write(JSON.stringify(state)); await w.close(); state.settings.lastExport=Date.now(); return true; }catch(e){ return false; }

  const csv='\uFEFF'+[head,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');

function purgeOld(){ const months=state.settings.retention; if(!months) return 0;
  const cut=new Date(); cut.setMonth(cut.getMonth()-months); const cutStr=ymd(cut);
  const before=state.entries.length+state.payments.length+state.expenses.length;
  /* ज़िप: हटाने से पहले पुरानी एंट्री का सारांश सुरक्षित रखें */
  try{
    const oldE=state.entries.filter(e=>e.date<cutStr);
    if(oldE.length){
      state.archive=state.archive||[];
      const agg={};
      oldE.forEach(function(e){ const k=e.partyId+'|'+e.date.slice(0,7)+'|'+e.kind; const a=agg[k]||(agg[k]={partyId:e.partyId,month:e.date.slice(0,7),kind:e.kind,qty:0,amt:0,n:0}); a.qty+=e.qty; a.amt+=e.amount; a.n++; });
      Object.keys(agg).forEach(function(k){ state.archive.push(agg[k]); });
      state.archiveMeta={at:Date.now(),from:cutStr,entries:oldE.length};
    }
  }catch(e){}
  state.entries=state.entries.filter(e=>e.date>=cutStr); state.payments=state.payments.filter(x=>x.date>=cutStr); state.expenses=state.expenses.filter(x=>x.date>=cutStr);
  return before-(state.entries.length+state.payments.length+state.expenses.length);
}

function chartCanvas(){
  const days=[], now=new Date(); for(let i=6;i>=0;i--){ const d=new Date(now); d.setDate(now.getDate()-i); days.push(d); }
  const vals=days.map(d=>{ const ds=ymd(d); return (IDX.date[ds]||{}).sale||0; });
  const max=Math.max(1,...vals); const W=900,H=520,pad=60,base=H-90,bw=(W-pad*2)/7*0.6,gap=(W-pad*2)/7;
  const c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
  g.fillStyle='#fff'; g.fillRect(0,0,W,H);
  g.fillStyle='#0f7b53'; g.font='bold 34px Arial'; g.fillText(shopName(),pad,58);
  g.fillStyle='#666'; g.font='20px Arial'; g.fillText(t('chart'),pad,90);
  days.forEach((d,i)=>{ const x=pad+i*gap+(gap-bw)/2, h=Math.max(6,Math.round(vals[i]/max*300)), y=base-h;
    g.fillStyle=(i===6)?'#b7791f':'#0f7b53'; g.beginPath(); const rr=10; g.moveTo(x,y+rr); g.arcTo(x,y,x+rr,y,rr); g.arcTo(x+bw,y,x+bw,y+rr,rr); g.lineTo(x+bw,base); g.lineTo(x,base); g.closePath(); g.fill();
    g.fillStyle='#333'; g.font='16px Arial'; g.textAlign='center'; g.fillText(cur()+Math.round(vals[i]),x+bw/2,y-10);
    g.fillStyle='#666'; g.fillText(DOW[LANG][d.getDay()],x+bw/2,base+28); g.textAlign='left'; });
  g.strokeStyle='#ddd'; g.beginPath(); g.moveTo(pad,base); g.lineTo(W-pad,base); g.stroke(); return c;
}
function shareChart(){ const c=chartCanvas();

function renderDriveBits(){

function toggleDriveAuto(){

  if(state.settings.driveAuto && !driveReady()) connectDrive();
}
function initDriveAuth(){
  if(!(window.google&&google.accounts&&google.accounts.oauth2)) return;
  if(tokenClient) return;
  try{
    tokenClient=google.accounts.oauth2.initTokenClient({
      client_id:GOOGLE_CLIENT_ID,
      scope:'https://www.googleapis.com/auth/drive.file',
      callback:function(resp){
        if(resp&&resp.access_token){ driveToken=resp.access_token; driveTokenExp=Date.now()+(((resp.expires_in||3600)-60)*1000); onDriveConnected(); }
        else { toast(t('dr_authfail')); }
      }
    });
  }catch(e){}
}
function connectDrive(){ initDriveAuth(); if(!tokenClient){ toast(t('dr_needlogin')); return; } try{ tokenClient.requestAccessToken({prompt:''}); }catch(e){ toast(t('dr_authfail')); } }
function driveReady(){ return !!driveToken && Date.now()<driveTokenExp; }
function onDriveConnected(){ state.settings.driveConnected=true; try{ save(); }catch(e){} toast(t('dr_connected')); renderDriveBits(); if(curModule==='drive') rerenderModule(); if(state.settings.driveAuto) driveBackupNow(true); try{ markSynced(); state.settings.lastDriveBackup=Date.now(); save(); renderSyncCard(); }catch(e){} }
function driveHeaders(extra){ return Object.assign({Authorization:'Bearer '+driveToken}, extra||{}); }
async function findBackupFile(){
  const q=encodeURIComponent("name='milk-backup.json' and trashed=false");
  const res=await fetch('https://www.googleapis.com/drive/v3/files?spaces=drive&q='+q+'&fields=files(id,name,modifiedTime)&orderBy=modifiedTime desc',{headers:driveHeaders()});
  if(!res.ok) throw new Error('find '+res.status);
  const j=await res.json(); return (j.files&&j.files[0])||null;
}
async function driveUpload(){
  const body=JSON.stringify(state);
  let id=state.settings.driveFileId||'';
  if(id){
    const res=await fetch('https://www.googleapis.com/upload/drive/v3/files/'+encodeURIComponent(id)+'?uploadType=media&fields=id',{method:'PATCH',headers:driveHeaders({'Content-Type':'application/json'}),body});
    if(!res.ok){ if(res.status===404) id=''; else throw new Error('upd '+res.status); }
  }
  if(!id){
    const found=await findBackupFile();
    if(found){
      id=found.id;
      const res=await fetch('https://www.googleapis.com/upload/drive/v3/files/'+encodeURIComponent(id)+'?uploadType=media&fields=id',{method:'PATCH',headers:driveHeaders({'Content-Type':'application/json'}),body});
      if(!res.ok) throw new Error('upd2 '+res.status);
    } else {
      const meta={name:'milk-backup.json',mimeType:'application/json'};
      const boundary='milkbnd'+Date.now();
      const mp='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+boundary+'--';
      const res=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:driveHeaders({'Content-Type':'multipart/related; boundary='+boundary}),body:mp});
      if(!res.ok){ const tx=await res.text(); throw new Error('new '+res.status+' '+tx.slice(0,150)); }
      const j=await res.json(); id=j.id;
    }
  }
  state.settings.driveFileId=id; state.settings.lastDriveBackup=Date.now();
  driveSelfSave=true; save(); driveSelfSave=false;
}
async function driveBackupNow(silent){
  if(driveBusy) return false;
  if(!driveReady()){ if(!silent) connectDrive(); return false; }
  if(!navigator.onLine){ if(!silent) toast(t('off_msg')); return false; }
  driveBusy=true;
  const st=$('drStatus'); if(st) st.textContent=t('dr_syncing');
  try{ await driveUpload(); if(!silent) toast(t('dr_saved')); return true; }
  catch(e){ if(!silent) toast(t('dr_fail')); return false; }
  finally{ driveBusy=false; renderDriveBits(); if(curModule==='drive') rerenderModule(); }
}
function scheduleAutoDriveBackup(){
  if(driveSelfSave) return;
  if(!state.settings.driveAuto||!driveReady()||!navigator.onLine) return;
  clearTimeout(autoBackupTimer);
  autoBackupTimer=setTimeout(function(){ driveBackupNow(true); },6000);
}
async function driveRestoreLatest(){
  if(!driveReady()){ connectDrive(); return; }
  try{
    const f=await findBackupFile(); if(!f){ toast(t('dr_none')); return; }
    const res=await fetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(f.id)+'?alt=media',{headers:driveHeaders()});
    if(!res.ok){ toast(t('dr_fail')); return; }
    const txt=await res.text(); applyImported(txt);
  }catch(e){ toast(t('dr_fail')); }
}

let calcBuf='';
function modCalc(){
  const keys=['7','8','9','/','4','5','6','*','1','2','3','-','0','.','=','+','C','⌫','%','00'];
  return `<div class="card"><h3>${t('calc')}</h3>
    <div class="field" style="margin:0 0 10px"><input type="text" id="calcScreen" readonly value="0" style="text-align:right;font-size:26px;font-weight:800;letter-spacing:1px" /></div>
    <div class="calc-grid">${keys.map(k=>`<button class="calc-k ${'/=*+-%'.indexOf(k)>=0?'op':''} ${k==='C'?'clr':''}" onclick="calcPress('${k}')">${k}</button>`).join('')}</div>
    <div class="hint" style="margin-top:10px">${t('calc_hint')}</div></div>`;
}
function calcPress(k){
  const s=$('calcScreen'); if(!s) return;
  if(k==='C'){ calcBuf=''; s.value='0'; return; }
  if(k==='⌫'){ calcBuf=calcBuf.slice(0,-1); s.value=calcBuf||'0'; return; }
  if(k==='='){
    try{
      const expr=calcBuf.replace(/[^0-9+\-*/.%()]/g,'');
      if(!expr){ s.value='0'; return; }
      const r=Function('return ('+expr+')')();
      if(isFinite(r)){ calcBuf=String(Math.round(r*10000)/10000); s.value=calcBuf; } else { calcBuf=''; s.value='0'; }
    }catch(e){ calcBuf=''; s.value='0'; }
    return;
  }
  calcBuf+=k; s.value=calcBuf;
}

function calcEmi(){ if(!$('emi_p')) return; const P=parseFloat($('emi_p').value)||0, R=(parseFloat($('emi_r').value)||0)/1200, N=parseInt($('emi_n').value)||0;
  let emi=0; if(P>0&&N>0){ emi=R>0?(P*R*Math.pow(1+R,N))/(Math.pow(1+R,N)-1):P/N; }
  const tot=emi*N, int=tot-P;
  if($('emi_out')) $('emi_out').textContent=money(emi);
  if($('emi_int')) $('emi_int').textContent=money(int);
  if($('emi_tot')) $('emi_tot').textContent=money(tot); }

/* ---- 📌 छूटी हुई एंट्री (Missed entries) ---- */
function missIndex(){
  const have={}, first={}, recent={};
  const cut=new Date(); cut.setDate(cut.getDate()-30); const cutStr=ymd(cut);
  state.entries.forEach(function(e){
    (have[e.date]||(have[e.date]={}))[e.partyId]=1;
    if(!first[e.partyId]||e.date<first[e.partyId]) first[e.partyId]=e.date;
    if(e.date>=cutStr) recent[e.partyId]=1;
  });
  return {have:have, first:first, recent:recent, cut:cutStr};
}
function missExpected(idx){
  idx=idx||missIndex();
  return state.parties.filter(function(p){
    if(p.type!=='customer'||p.active===false) return false;
    return (p.defaultQty||0)>0 || !!idx.recent[p.id];
  });
}
function missForDate(date,idx){
  idx=idx||missIndex();
  const have=idx.have[date]||{};
  const today=todayStr();
  return missExpected(idx).filter(function(p){
    if(have[p.id]) return false;
    if(isHoliday(date,p.id)) return false;
    const f=idx.first[p.id];
    if(f){ if(date<f) return false; } else { if(date<today) return false; }
    return true;
  });
}
function missTodayCount(){ try{ return missForDate(todayStr()).length; }catch(e){ return 0; } }
function missDates(days){
  const idx=missIndex(); const out=[];
  for(let i=1;i<=days;i++){ const d=new Date(); d.setDate(d.getDate()-i); const ds=ymd(d); const m=missForDate(ds,idx); if(m.length) out.push({date:ds,missing:m}); }
  return out;
}

      <button class="btn ghost sm" onclick="openMissDate('${row.date}')">${t('miss_fill')}</button></div>`;}).join(''):`<div class="empty"><span class="big">✅</span>${t('miss_none')}</div>`}</div>

  if(force!==true){ if(now<due) return; if(state.settings.missLastRemind===key) return; }

function toggleBkSched(){ state.settings.bkSchedOn=!state.settings.bkSchedOn; save(); bkSchedBits(); toast(t('bk_sched')+': '+(state.settings.bkSchedOn?t('on'):t('off'))); if(state.settings.bkSchedOn){ askNotifPerm(); } }
function nextBackupText(){ const st=state.settings; if(!st.bkSchedOn) return t('bk_sched_off');
  const every=(st.bkSchedEvery||1); const base=st.bkSchedLast||Date.now();
  const due=new Date(base+every*86400000);
  return fmtDate(ymd(due))+' · '+(st.bkSchedTime||'21:00'); }
function backupDue(){ const st=state.settings; if(!st.bkSchedOn) return false;
  const parts=(st.bkSchedTime||'21:00').split(':'); const h=parseInt(parts[0])||0, m=parseInt(parts[1])||0;
  const now=new Date(); const today=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m,0,0);
  const every=(st.bkSchedEvery||1); const last=st.bkSchedLast||0;
  return now>=today && (now-last)>=every*86400000; }
function checkBackupSchedule(){ try{ if(backupDue()) runScheduledBackup(false); }catch(e){} }
function doLocalBackup(){ try{ if(fsHandle) return writeBackupToLinked(); }catch(e){} try{ takeAutoBackup(); return true; }catch(e){ return false; } }
async function runScheduledBackup(manual){
  if(bkRunning) return; bkRunning=true;
  const st=state.settings; const target=st.bkSchedTarget||'file'; let ok=false;
  try{
    if(target==='file'||target==='both'){ try{ ok=(await doLocalBackup())||ok; }catch(e){} }
    if(target==='drive'||target==='both'){ try{ if(driveReady()&&navigator.onLine){ await driveBackupNow(true); ok=true; } }catch(e){} }
  }catch(e){}
  st.bkSchedLast=Date.now();
  let sizeStr=''; try{ const b=new Blob([JSON.stringify(state)]).size; sizeStr=(b/1048576>1?(b/1048576).toFixed(2)+' MB':Math.round(b/1024)+' KB'); }catch(e){}
  (st.bkHistory=st.bkHistory||[]).unshift({at:Date.now(),target:manual?'manual':target,ok:ok,size:sizeStr});
  if(st.bkHistory.length>10) st.bkHistory.length=10;
  save(); notifyBackup(ok); bkRunning=false;
  if(curModule==='backup') rerenderModule();
  if(manual) toast(ok?t('bk_done'):t('bk_fail'));
}

/* ---- 📊 Month comparison ---- */
function monthStats(pre){
  const e=state.entries.filter(x=>x.date.startsWith(pre));
  const sale=e.filter(x=>x.kind==='sale').reduce((s,x)=>s+x.amount,0);
  const purch=e.filter(x=>x.kind==='purchase').reduce((s,x)=>s+x.amount,0);
  const exp=state.expenses.filter(x=>x.date.startsWith(pre)).reduce((s,x)=>s+x.amount,0);
  const wast=state.wastage.filter(x=>x.date.startsWith(pre)).reduce((s,x)=>s+(x.value||0),0);
  return {sale,purch,exp,wast,net:sale-purch-exp-wast};
}
function modCompare(){ return `<div class="card"><h3>📊 ${t('compare')}</h3><div id="cmpBox"></div></div>`; }
function renderCompare(){
  const box=$('cmpBox'); if(!box) return;

  const cur=now.getFullYear()+'-'+p2(now.getMonth()+1);
  const pd=new Date(now.getFullYear(),now.getMonth()-1,1); const prev=pd.getFullYear()+'-'+p2(pd.getMonth()+1);

  box.innerHTML=`<div class="hint" style="margin-bottom:8px">${fmtMonth(prev)} → ${fmtMonth(cur)}</div>
    ${row(t('c_sale'),a.sale,b.sale,true)}
    ${row(t('c_purch'),a.purch,b.purch,false)}

/* ================= FINGERPRINT / BIOMETRIC LOCK ================= */
function bioNative(){ try{ return (typeof window.MilkBio !== 'undefined' && window.MilkBio); }catch(e){ return false; } }
function bioSupported(){
  if(bioNative()) return true;
  try{ return !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create && window.isSecureContext); }catch(e){ return false; }
}
function b64(buf){ let s=''; const b=new Uint8Array(buf); for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
function b64d(s){ const bin=atob(s); const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a; }
function toggleBio(){
  if(state.settings.biometricLock){ state.settings.biometricLock=false; state.settings.bioCredId=''; save(); renderSettingsBits(); toast(t('bio_off')); try{ if(bioNative()&&window.MilkBio.disable) window.MilkBio.disable(); }catch(e){} return; }
  enableBiometric();
}
function enableBiometric(){
  if(!bioSupported()){ toast(t('bio_na')); return; }
  if(bioNative()){ try{ window.MilkBio.enable(); state.settings.biometricLock=true; save(); renderSettingsBits(); toast(t('bio_on')); }catch(e){ toast(t('bio_na')); } return; }
  try{
    const challenge=new Uint8Array(32); crypto.getRandomValues(challenge);
    const uid=new Uint8Array(16); crypto.getRandomValues(uid);
    navigator.credentials.create({ publicKey:{
      challenge:challenge,
      rp:{ name:'Milk Hisaab', id:location.hostname },
      user:{ id:uid, name:'owner', displayName:'Owner' },
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{ authenticatorAttachment:'platform', userVerification:'required' },
      timeout:60000, attestation:'none'
    }}).then(function(cred){
      if(cred && cred.rawId){ state.settings.bioCredId=b64(cred.rawId); state.settings.biometricLock=true; save(); renderSettingsBits(); toast(t('bio_on')); }
      else { toast(t('bio_na')); }
    }).catch(function(){ toast(t('bio_na')); });
  }catch(e){ toast(t('bio_na')); }
}
function showBioLock(){
  const el=$('bioLock'); if(!el) return;
  if($('bioTitle')) $('bioTitle').textContent=t('bio_title');
  if($('bioSub')) $('bioSub').textContent=t('bio_sub');
  if($('bioBtn')) $('bioBtn').textContent='🔒 '+t('bio_open');
  if($('bioPinBtn')) $('bioPinBtn').textContent=t('bio_use_pin');
  el.classList.add('on');
  setTimeout(function(){ try{ bioUnlock(); }catch(e){} }, 350);
}
function hideBioLock(){ const el=$('bioLock'); if(el) el.classList.remove('on'); }
function bioUsePin(){ hideBioLock(); if(state.settings.pin) showLock(); }
function bioUnlock(){
  if(bioNative()){ try{ window.MilkBio.authenticate(); return; }catch(e){} }
  if(!state.settings.bioCredId){ toast(t('bio_na')); return; }
  try{
    const challenge=new Uint8Array(32); crypto.getRandomValues(challenge);
    navigator.credentials.get({ publicKey:{
      challenge:challenge,
      allowCredentials:[{ id:b64d(state.settings.bioCredId), type:'public-key' }],
      userVerification:'required', timeout:60000
    }}).then(function(r){ if(r) hideBioLock(); else toast(t('bio_fail')); })
     .catch(function(){ toast(t('bio_fail')); });
  }catch(e){ toast(t('bio_fail')); }
}
function __bioOk(){ hideBioLock(); }
function __bioFail(){ toast(t('bio_fail')); }

function modTrend(){ return `<div class="card"><h3>📈 ${t('trend')}</h3><div id="trBox"></div></div>`; }
function renderTrend(){
  const box=$('trBox'); if(!box) return;
  const now=new Date(); const months=[];
  for(let i=11;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); months.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')); }
  const sales=months.map(m=>state.entries.filter(e=>e.date.startsWith(m)&&e.kind==='sale').reduce((s,e)=>s+e.amount,0));
  const nets=months.map(m=>monthStats(m).net);
  const max=Math.max(1,...sales,...nets);
  const W=900,H=460,pad=40,base=H-70,bw=(W-pad*2)/12*0.62,gap=(W-pad*2)/12;
  const c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
  g.fillStyle='#fff'; g.fillRect(0,0,W,H);
  g.strokeStyle='#e6ece8'; g.lineWidth=1;
  for(let i=1;i<=4;i++){ const y=base-(300/4)*i; g.beginPath(); g.moveTo(pad,y); g.lineTo(W-pad,y); g.stroke(); }
  months.forEach(function(m,i){
    const x=pad+i*gap+(gap-bw)/2;
    const h=Math.max(4,Math.round(sales[i]/max*300));
    g.fillStyle='#0f7b53'; g.fillRect(x,base-h,bw*0.55,h);
    const h2=Math.max(0,Math.round(Math.max(0,nets[i])/max*300));
    g.fillStyle='#b7791f'; g.fillRect(x+bw*0.55,base-h2,bw*0.45,h2);
    g.fillStyle='#666'; g.font='13px Arial'; g.textAlign='center';
    g.fillText(MONTHS[LANG][(+m.slice(5,7))-1].slice(0,3),x+bw/2,base+18);
  });
  g.strokeStyle='#bbb'; g.beginPath(); g.moveTo(pad,base); g.lineTo(W-pad,base); g.stroke();
  box.innerHTML='<img alt="" src="'+c.toDataURL('image/png')+'" style="width:100%;border-radius:12px" />'
    +`<div class="hint" style="margin-top:8px">🟩 ${t('c_sale')} · 🟨 ${t('net_profit')} — ${t('last12')}</div>`;
